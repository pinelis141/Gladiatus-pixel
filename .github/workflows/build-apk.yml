name: Build Gladiatus APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Gerar sprites, validar e compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow e gerar sprites PNG
        run: |
          python -m pip install --upgrade pip Pillow
          python tools/generate_sprites.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('assets/sprites').glob('*.png'))
          assert len(files) == 17, f'Sprites encontrados: {len(files)}'
          for path in files:
              with Image.open(path) as im:
                  im.verify()
          print(f'{len(files)} sprites PNG validados.')
          PY

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android nativo
        run: flutter create --platforms=android --org com.roma.gladiatus --project-name gladiatus_pixel .

      - name: Instalar dependências Dart
        run: flutter pub get

      - name: Verificar análise estática
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Gerar APK release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gladiatus-Pixel-Art-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
