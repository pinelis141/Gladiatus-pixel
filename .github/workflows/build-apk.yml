name: Audit Before APK

on:
  push:
    branches: [main, feature/optimization-unified-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditoria obrigatoria antes do APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar assets, verificar sprite e som
        run: |
          python -m pip install Pillow
          python tools/generate_sprites.py
          python tools/generate_hd_sprites.py
          python tools/extract_hero_art.py
          python tools/verify_hero_assets.py
          python tools/generate_audio.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from wave import open as wave_open
          files=list(Path('assets/sprites').glob('*.png'))
          assert len(files)==33, f'Esperados 33 sprites; há {len(files)}'
          for path in files:
              with Image.open(path) as sprite:
                  sprite.verify()
          sounds=list(Path('assets/audio').glob('*.wav'))
          assert len(sounds)==3, f'Esperados 3 WAV; há {len(sounds)}'
          for path in sounds:
              with wave_open(str(path)) as sound:
                  assert sound.getnframes()>0
          print('Assets auditados:',len(files),'PNG e',len(sounds),'WAV')
          PY
      - name: Contraste e auditoria pre-release
        run: |
          python tools/audit_ui_contrast.py --strict
          python tools/pre_release_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar projeto Android e dependencias
        run: |
          flutter create --platforms=android --org com.roma.gladiatus --project-name gladiatus_pixel .
          flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Suite de testes e regressao
        run: flutter test --reporter expanded
      - name: Publicar comparativo visual para revisao
        uses: actions/upload-artifact@v4
        with:
          name: Auditoria-Arte-128x144
          path: assets/previews/gladiator_comparison.png
          if-no-files-found: error
          retention-days: 14

  android:
    name: APK somente apos auditoria aprovada
    needs: audit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar arquivos validados
        run: |
          python -m pip install Pillow
          python tools/generate_sprites.py
          python tools/generate_hd_sprites.py
          python tools/extract_hero_art.py
          python tools/verify_hero_assets.py
          python tools/generate_audio.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar Android
        run: |
          flutter create --platforms=android --org com.roma.gladiatus --project-name gladiatus_pixel .
          flutter pub get
      - name: Gerar release apos auditoria
        run: flutter build apk --release --no-tree-shake-icons
      - name: Aviso de assinatura
        run: |
          echo "::warning::APK de teste: a assinatura persistente ainda requer keystore privado em GitHub Secrets. Nao desinstale versoes antigas sem backup."
      - uses: actions/upload-artifact@v4
        with:
          name: Gladiatus-Pixel-2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
